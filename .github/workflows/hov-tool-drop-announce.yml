name: hov Tool Drop announce

# Reusable announce-only release train for every hov-marketplace plugin.
#
# Caller (in the plugin repo), pinned to a full commit SHA of this repo:
#
#   name: Release train
#   on:
#     release:
#       types: [published, edited]
#   permissions:
#     contents: read
#     id-token: write
#   jobs:
#     announce:
#       uses: StartupBros-com/hov-marketplace/.github/workflows/hov-tool-drop-announce.yml@<sha>
#
# Identity is the OIDC token, not a shared secret: the announce endpoint
# verifies repository/repository_owner claims and pins job_workflow_ref to
# THIS file's path, so only releases flowing through this blessed workflow
# can post a card, and no repo can announce as another.

on:
  workflow_call:
    inputs:
      announce-url:
        description: Tool Drop announce endpoint
        type: string
        required: false
        default: 'https://members.startupbros.com/api/internal/ops/tool-releases'

permissions: {}

jobs:
  announce:
    if: github.event.release.draft == false && github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # AFTER this ancestry check, never before: later steps execute a script
      # against the CHECKED-OUT TAG's tree, so running tag-sourced content
      # earlier would let anyone able to push a tag influence a job that mints
      # an identity token. Every tag-derived input sits below the proof that
      # the tag descends from the protected default branch.
      - name: Require release commit on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          release_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$release_sha" "origin/$DEFAULT_BRANCH"

      - name: Check out hov-marketplace (manifest + announce script)
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          repository: StartupBros-com/hov-marketplace
          ref: main
          path: hov-marketplace
          persist-credentials: false

      - name: Resolve latest stable release
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)"
          test -n "$latest_id"
          echo "id=$latest_id" >> "$GITHUB_OUTPUT"

      - name: Mint OIDC identity token
        id: oidc
        run: |
          token="$(curl --fail --silent \
            -H "authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Announce release
        env:
          EVENT_ACTION: ${{ github.event.action }}
          REPOSITORY: ${{ github.event.repository.name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name || github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          RELEASE_NOTES: ${{ github.event.release.body }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_DRAFT: ${{ github.event.release.draft }}
          LATEST_STABLE_ID: ${{ steps.stable.outputs.id }}
          SOURCE_ROOT: ${{ github.workspace }}
          MARKETPLACE_MANIFEST: ${{ github.workspace }}/hov-marketplace/.claude-plugin/marketplace.json
          ANNOUNCE_URL: ${{ inputs.announce-url }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          source_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          export SOURCE_SHA="$source_sha"
          ./hov-marketplace/scripts/tool-drop-announce.sh
