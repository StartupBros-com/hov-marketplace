name: Repin reconcile

# Keep the distribution manifest converging on what the plugins have actually
# released, by opening a repin PR whenever the two disagree.
#
# This is the piece that removes the manual step the release recipe used to
# require. It does NOT merge: the card is still updated by a reviewed PR, because
# a standing credential able to write this manifest unattended is the one whose
# compromise reaches every installed client. What changes is only who does the
# typing.
#
# The write is local — a branch and a PR in THIS repository. The reads are release
# metadata on the plugin repositories. Draft-first means the release that needs
# pinning is a DRAFT, and drafts are invisible to any token without push on that
# repository — including this repository's GITHUB_TOKEN. So the reads use a
# short-lived token minted from the org's least-privilege release App
# (HOV_RELEASE_APP_ID + HOV_RELEASE_APP_PRIVATE_KEY, contents read/write on the
# plugin repositories only). The token must carry contents: write because GitHub
# shows drafts only to push-capable identities; this workflow only READS with it,
# and it expires with the job. Without those secrets the job falls back to
# GITHUB_TOKEN and can only see published releases. The manifest write remains
# local: a branch and a PR in this repository, reviewed by a human.
#
# The PR itself is opened as the StartupBros HOV Marketplace Bot App
# (HOV_MARKETPLACE_APP_ID + HOV_MARKETPLACE_APP_PRIVATE_KEY, contents and
# pull-request write on THIS repository only, never merge): the organization keeps
# GitHub's default that forbids GITHUB_TOKEN from creating pull requests, and a PR
# opened by an App token runs the validator without the approval gate a
# GITHUB_TOKEN-created PR would sit behind. Without the bot secrets the branch is
# still pushed and the run tells you which PR to open by hand.

on:
  schedule:
    # Off the hour on purpose: :00 is where every scheduled job on GitHub piles up.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      only_plugin:
        description: 'Restrict to one plugin name (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repin-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          persist-credentials: false

      - name: Decide whether the release App is available for draft-visible reads
        id: identity
        env:
          HOV_RELEASE_APP_ID: ${{ secrets.HOV_RELEASE_APP_ID }}
          HOV_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$HOV_RELEASE_APP_ID" ] && [ -n "$HOV_RELEASE_APP_PRIVATE_KEY" ]; then
            echo "have_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_app=false" >> "$GITHUB_OUTPUT"
            echo "::warning::release App secrets are not visible to this repository; reads use GITHUB_TOKEN and cannot see staged DRAFT releases, so draft-first repins will not be opened automatically."
          fi

      # Plugin-repositories-only token. GitHub lists another repository's DRAFT releases only
      # to identities with push access, so the token must carry contents: write even though
      # this workflow only reads with it (verified 2026-09-06: a contents: read token saw no
      # draft and reported "already matches"). It lives for this job, is scoped to the nine
      # plugin repositories, and the App itself holds no permission on this repository.
      - name: Mint a release App token for the plugin repositories (draft-visible)
        if: steps.identity.outputs.have_app == 'true'
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOV_RELEASE_APP_ID }}
          private-key: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
          owner: StartupBros-com
          repositories: harness-vet,token-eater,skill-tuner,wsl-cdp,memory-dream,design-rails,rent-check,papercut,pro-gate,sign-it
          permission-contents: write
          permission-metadata: read

      - name: Reconcile the manifest against released plugins
        id: reconcile
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          ONLY_PLUGIN: ${{ inputs.only_plugin }}
          PLAN_FILE: ${{ runner.temp }}/repin-plan.tsv
        run: |
          set -euo pipefail
          ./scripts/repin-reconcile.sh
          if [ -s "$PLAN_FILE" ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            # Content-addressed branch name: the SAME drift always produces the
            # SAME branch, so a second run finds the branch already there and
            # opens nothing. That is what makes an hourly schedule safe.
            echo "key=$(sha256sum "$PLAN_FILE" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether the marketplace bot is available to open the PR
        if: steps.reconcile.outputs.drift == 'true'
        id: bot_identity
        env:
          HOV_MARKETPLACE_APP_ID: ${{ secrets.HOV_MARKETPLACE_APP_ID }}
          HOV_MARKETPLACE_APP_PRIVATE_KEY: ${{ secrets.HOV_MARKETPLACE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$HOV_MARKETPLACE_APP_ID" ] && [ -n "$HOV_MARKETPLACE_APP_PRIVATE_KEY" ]; then
            echo "have_bot=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_bot=false" >> "$GITHUB_OUTPUT"
            echo "::warning::marketplace bot secrets are not visible; the repin branch will be pushed but the PR must be opened by hand (GITHUB_TOKEN may not create pull requests in this organization)."
          fi

      - name: Mint a marketplace-bot token for this repository
        if: steps.reconcile.outputs.drift == 'true' && steps.bot_identity.outputs.have_bot == 'true'
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOV_MARKETPLACE_APP_ID }}
          private-key: ${{ secrets.HOV_MARKETPLACE_APP_PRIVATE_KEY }}

      - name: Open the repin PR
        if: steps.reconcile.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || github.token }}
          HAVE_BOT: ${{ steps.bot_identity.outputs.have_bot }}
          PLAN_FILE: ${{ runner.temp }}/repin-plan.tsv
          BRANCH: repin/auto-${{ steps.reconcile.outputs.key }}
        run: |
          set -euo pipefail
          # Idempotence keys on an OPEN PR, not on the branch: a push that succeeded while the
          # PR create failed must not leave the drift silently unopened forever.
          open_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ]; then
            echo "::notice::PR #$open_pr is already open for this exact drift; nothing to open."
            exit 0
          fi
          branch_exists=false
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            branch_exists=true
            echo "branch $BRANCH exists without an open PR; reusing it"
          fi

          {
            printf 'Opened by the repin reconciler: the marketplace manifest disagreed with what these plugins have released.\n\n'
            printf '| plugin | version | tag | releaseId | sha | release state |\n|---|---|---|---|---|---|\n'
            while IFS=$'\t' read -r name version tag rel_id sha is_draft; do
              [ -n "$name" ] || continue
              state=published
              [ "$is_draft" = true ] && state='**draft** (staged, publish after this merges)'
              printf '| %s | %s | `%s` | %s | `%s` | %s |\n' \
                "$name" "$version" "$tag" "$rel_id" "${sha:0:12}" "$state"
            done < "$PLAN_FILE"
            printf '\nRe-running the reconciler on this same drift is a no-op — the branch name is derived from the change itself.\n'
            printf '\nA plugin listed as **draft** is staged and waiting on this card: merge here, then publish it (pro-gate: the "Publish staged release" workflow).\n'
          } > "$RUNNER_TEMP/pr-body.md"

          if [ "$branch_exists" = false ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git checkout -b "$BRANCH"
            git add .claude-plugin/marketplace.json
            git commit -m 'chore(marketplace): repin cards to the plugins current releases'
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          fi
          if [ "$HAVE_BOT" != true ]; then
            echo "::warning::branch $BRANCH is pushed but no bot identity is available to open the PR; open it by hand: gh pr create --repo $GITHUB_REPOSITORY --base main --head $BRANCH"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title 'chore(marketplace): repin cards to the plugins current releases' \
            --body-file "$RUNNER_TEMP/pr-body.md"
