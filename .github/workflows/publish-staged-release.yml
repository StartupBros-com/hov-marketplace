name: Publish staged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: <name>--v<version> draft whose card on main already pins it
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-staged-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Provision pinned CI tools
        run: release/scripts/provision-ci-tools.sh
      - name: Require release App identity
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          HOV_RELEASE_APP_ID: ${{ secrets.HOV_RELEASE_APP_ID }}
          HOV_RELEASE_APP_PRIVATE_KEY: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
        run: release/scripts/publish-staged.sh --identity
      - name: Mint release App token
        id: mint
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOV_RELEASE_APP_ID }}
          private-key: ${{ secrets.HOV_RELEASE_APP_PRIVATE_KEY }}
          owner: StartupBros-com
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Publish the pinned staged release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          MARKETPLACE_REPO: ${{ github.repository }}
          MARKETPLACE_TOKEN: ${{ github.token }}
        run: release/scripts/publish-staged.sh
